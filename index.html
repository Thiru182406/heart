<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Colorful Heart</title>

<style>
body{
    margin:0;
    background:black;
    overflow:hidden;
}
canvas{
    display:block;
}
</style>

</head>
<body>

<canvas id="canvas"></canvas>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const colors=[
"red","orange","yellow","lime",
"cyan","blue","violet","pink","white"
];

let t=0;

function draw(){

ctx.fillStyle="rgba(0,0,0,0.15)";
ctx.fillRect(0,0,canvas.width,canvas.height);

for(let i=0;i<250;i++){

let a=i*Math.PI*2/250+t;

let x=16*Math.pow(Math.sin(a),3);
let y=13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a);

x*=18;
y*=18;

ctx.beginPath();
ctx.fillStyle=colors[Math.floor(Math.random()*colors.length)];
ctx.arc(canvas.width/2+x,canvas.height/2-y,3,0,Math.PI*2);
ctx.fill();

ctx.beginPath();
ctx.strokeStyle=ctx.fillStyle;
ctx.moveTo(canvas.width/2,canvas.height/2);
ctx.lineTo(canvas.width/2+x,canvas.height/2-y);
ctx.stroke();

}

t+=0.02;

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
