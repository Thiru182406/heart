<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAPPY FRIENDSHIP DAY ❤️ </title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:black;
overflow:hidden;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
height:100vh;
font-family:Arial,sans-serif;
}

canvas{
position:absolute;
top:0;
left:0;
}

#text{
position:absolute;
bottom:50px;
font-size:50px;
font-weight:bold;
color:#ff0033;
text-shadow:
0 0 10px red,
0 0 20px red,
0 0 40px red,
0 0 60px red;
animation:glow 1.5s infinite alternate;
}

@keyframes glow{
from{
transform:scale(1);
}
to{
transform:scale(1.08);
}
}
</style>

</head>

<body>

<canvas id="canvas"></canvas>

<div id="text">
HAPPY FRIENDSHIP DAY ❤️
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const cx=canvas.width/2;
const cy=canvas.height/2-40;

const points=[];

for(let i=0;i<400;i++){

let t=i*Math.PI*2/400;

let x=16*Math.pow(Math.sin(t),3);

let y=13*Math.cos(t)
-5*Math.cos(2*t)
-2*Math.cos(3*t)
-Math.cos(4*t);

points.push({
x:x*18,
y:-y*18
});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.strokeStyle="red";
ctx.lineWidth=1;

for(let p of points){

ctx.beginPath();

ctx.moveTo(cx,cy);

ctx.lineTo(
cx+p.x,
cy+p.y
);

ctx.stroke();

ctx.beginPath();

ctx.fillStyle="red";

ctx.arc(
cx+p.x,
cy+p.y,
2,
0,
Math.PI*2
);

ctx.fill();
}

draw();

window.addEventListener("resize", () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
});

</script>

</body>
</html>
